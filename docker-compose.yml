services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: fitstack
      POSTGRES_USER: fitstack
      # Reads DB_PASSWORD from .env
      POSTGRES_PASSWORD: ${DB_PASSWORD:-fitstack}
    ports:
      - "5450:5432"
    volumes:
      - fitstack-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitstack -d fitstack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fitstack-postgres:
