services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fitstack
      POSTGRES_USER: fitstack
      POSTGRES_PASSWORD: fitstack
    ports:
      - "5433:5432"
    volumes:
      - fitstack-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitstack -d fitstack"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fitstack-postgres:
